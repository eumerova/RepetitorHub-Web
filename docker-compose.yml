version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: repetitorhub_pg
    environment:
      POSTGRES_DB: repetitorhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql

  mongodb:
    image: mongo:6.0
    container_name: repetitorhub_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata: